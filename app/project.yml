name: LocalAI
options:
  bundleIdPrefix: de.kisruptiv
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  LocalAI:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Skills
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/Engine
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: KI/lokal
        CFBundleDisplayName: KI/lokal
        CFBundleShortVersionString: "0.7.1"
        CFBundleVersion: "4"
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleURLTypes:
          - CFBundleURLName: de.kisruptiv.kilokal
            CFBundleURLSchemes: [kilokal]
        NSHumanReadableCopyright: "© 2026 KIsruptiv · kisruptiv.de"
        NSMicrophoneUsageDescription: "KI/lokal nutzt das Mikrofon für das Diktat im Chat."
        NSSpeechRecognitionUsageDescription: "KI/lokal wandelt dein Diktat auf dem Mac in Text um."
        NSCalendarsFullAccessUsageDescription: "KI/lokal liest und erstellt auf deinen Wunsch Termine."
        NSRemindersFullAccessUsageDescription: "KI/lokal liest und erstellt auf deinen Wunsch Erinnerungen."
        NSContactsUsageDescription: "KI/lokal sucht auf deinen Wunsch Kontakte (z. B. E-Mail-Adressen für Entwürfe)."
        NSAppleEventsUsageDescription: "KI/lokal steuert auf deinen Wunsch deinen Browser (Tabs lesen, Seiten öffnen, klicken, tippen)."
    settings:
      base:
        PRODUCT_NAME: KI lokal
        PRODUCT_BUNDLE_IDENTIFIER: de.kisruptiv.kilokal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
